<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent SecOps &mdash; CAF/WAF Compliance Gate</title>
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#128737;</text></svg>">
</head>
<body>
  <div id="root">
    <div class="boot">Loading dashboard&hellip;</div>
  </div>

  <!--
    React is loaded from a CDN and JSX is compiled in the browser by Babel.
    That is a deliberate trade-off for a college demo: no npm, no node_modules,
    no build step -- `python -m dashboard.server` is the only command needed.
    A production app would use Vite and compile JSX ahead of time.
  -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

  <script>
    // If the CDN is unreachable (college wifi, offline demo), say so plainly
    // instead of leaving a blank page.
    window.addEventListener('load', function () {
      if (!window.React || !window.ReactDOM || !window.Babel) {
        document.getElementById('root').innerHTML =
          '<div class="boot boot-error">' +
          '<strong>Could not load React from the CDN.</strong>' +
          '<p>The dashboard needs an internet connection the first time it loads. ' +
          'The gate itself does not &mdash; run it from the terminal instead:</p>' +
          '<pre>python -m agent.cli evaluate --plan examples/plans/azure_noncompliant.plan.json</pre>' +
          '</div>';
      }
    });
  </script>

   <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
